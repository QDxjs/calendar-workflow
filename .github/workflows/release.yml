name: Release Windows portable

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.5.4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate version tag and source branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python -c 'from generate import APP_VERSION; print(APP_VERSION)'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw 'Release tag must match generate.APP_VERSION.'
          }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The requested tag does not exist.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Only a commit on main can be released.' }
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check source and run regressions
        shell: pwsh
        run: |
          python tools/check_project.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, collect licenses and verify portable application
        run: ./build_portable.ps1
      - name: Export ZIP and SHA-256
        shell: pwsh
        run: |
          $archive = "dist/CalendarWorkflow-$($env:RELEASE_TAG.Substring(1))-windows-x64.zip"
          ./export_portable.ps1 -PackageDirectory ./dist/CalendarWorkflow -ArchivePath $archive
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding utf8NoBOM
      - name: Keep build artifacts if release upload needs retry
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CalendarWorkflow-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "dist/CalendarWorkflow-$($env:RELEASE_TAG.Substring(1))-windows-x64.zip"
          gh release create $env:RELEASE_TAG $archive "$archive.sha256" --verify-tag --title "每日文学日历 $env:RELEASE_TAG" --notes-file .github/release-notes.md --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; an existing release is never overwritten automatically.' }
