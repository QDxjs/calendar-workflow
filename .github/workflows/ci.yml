name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Check public files and pinned resources
        run: python tools/check_project.py
      - name: Run date, import, rendering and publication regressions
        run: python -m unittest discover -s tests -v
      - name: Verify corpus and manual desktop workflows, replay and cancellation
        run: python launcher.py --verify-portable
      - name: Verify offline gallery in Chromium
        run: python tools/verify_gallery_ui.py
      - name: Verify all built-in quotations across all layouts
        run: python tools/verify_calendar_layouts.py --output "${{ runner.temp }}/calendar-layouts"
      - name: Check desktop controls at common display scales
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($scale in @('1', '1.25', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            $output = Join-Path $env:RUNNER_TEMP "desktop-ui-$($scale.Replace('.', '_'))"
            python tools/verify_desktop_ui.py --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
